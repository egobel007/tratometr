name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild -project Tratometr.xcodeproj -target Tratometr -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || true
          grep -E "error:|BUILD SUCCEEDED|BUILD FAILED" build.log || true
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          test -d build/Release-iphoneos/Tratometr.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Tratometr.app Payload/
          find Payload -name "*.appex" -maxdepth 4
          test -d Payload/Tratometr.app/PlugIns/TratometrWidgetExtension.appex
          zip -qry Tratometr.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Tratometr-ipa
          path: Tratometr.ipa

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  selftest:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for the iOS simulator
        run: |
          xcodebuild -project Tratometr.xcodeproj -target Tratometr -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || true
          grep -E "error:" sim.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          test -d build/Debug-iphonesimulator/Tratometr.app

      - name: Run self-test on a simulated iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Tratometr.app
          ( sleep 240; pkill -f "simctl launch" ) &
          xcrun simctl launch --console-pty "$UDID" com.egorbel.tratometr -selftest 2>&1 | tee selftest.log || true
          grep "FAIL" selftest.log | while IFS= read -r line; do echo "::error::${line}"; done
          grep -q "SELFTEST OK" selftest.log

